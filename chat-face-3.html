<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Face</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5A6E">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chat Face">
<style>
:root{
  --bg:#F2F0FA; --surface:#FFFFFF; --ink:#241A3F; --muted:#6F6890;
  --coral:#FF5A6E; --coral-d:#E8445A; --teal:#12B3A0; --line:#E3DFF2; --danger:#B42343;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#E7E3F5;color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.muted{color:var(--muted)} .small{font-size:13px}
.ic{width:22px;height:22px;flex:none}

/* header + tabs */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.pill{background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.local{background:#FFF3D6;color:#6B4A00;font-size:12.5px;padding:6px 16px;text-align:center}
main{flex:1;overflow-y:auto;padding:14px 14px 22px;-webkit-overflow-scrolling:touch}
main.lock{overflow:hidden;padding:0}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tabs button.on{color:var(--coral)}
.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--coral)}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.pad{padding:18px}
h2{font-size:20px;letter-spacing:-.01em;margin-bottom:6px}
h3{font-size:15px;margin:4px 2px 10px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}

/* controls */
.btn{background:var(--coral);color:#fff;font-weight:700;border-radius:99px;padding:11px 20px;transition:background .15s}
.btn:hover{background:var(--coral-d)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#F6F4FC}
.btn.danger{background:var(--danger)}
.btn.dark{background:var(--ink)}
.btn.block{width:100%}
input,textarea{width:100%;background:#F7F5FD;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
input:focus,textarea:focus{border-color:var(--coral);background:#fff}
textarea{resize:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:6px 0}
.x{display:inline-flex;align-items:center;gap:4px;color:var(--muted);padding:6px;border-radius:10px}
.x:hover{background:#F1EEFA;color:var(--ink)}

/* avatar */
img.av{object-fit:cover;background:#E6E2F4}
.rep{padding:10px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border-bottom:0}
.rep .txt{margin:8px 0}
.rep .row{flex-wrap:wrap}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;flex:none}

/* auth */
.auth{flex:1;overflow-y:auto;padding:36px 24px 28px;display:flex;flex-direction:column;align-items:center}
.auth h1{font-size:46px;line-height:1;font-weight:900;letter-spacing:-.04em;margin:14px 0 6px}
.auth .tag{color:var(--muted);margin-bottom:22px;text-align:center}
.auth .box{width:100%;max-width:380px}
.seg{display:flex;background:#E6E2F4;border-radius:99px;padding:4px;margin-bottom:18px;width:100%;max-width:380px}
.seg button{flex:1;padding:9px;border-radius:99px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(36,26,63,.15)}
.boot{flex:1;display:flex;align-items:center;justify-content:center}

/* posts */
.composer textarea{border:0;background:transparent;padding:8px 4px;min-height:56px}
.composer textarea:focus{background:transparent}
.composer .row.end{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.post .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.who{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.who strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;color:var(--muted)}
.who .meta{display:flex;gap:8px}
.txt{white-space:normal;overflow-wrap:anywhere;margin:4px 0 10px;line-height:1.5}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000 center/cover no-repeat;margin:2px 0 10px}
.vid .pl{position:absolute;inset:0;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2)}
.vid .pl span{width:64px;height:64px;border-radius:50%;background:rgba(255,90,110,.95);display:flex;align-items:center;justify-content:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-size:15px}
.mi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mi .ic{width:22px;height:22px}
.mt-wide{width:100%;text-align:left;gap:12px;font-size:15px}
.vid.v{aspect-ratio:9/16;width:min(100%,calc(70vh*9/16));margin:2px auto 10px}
a.mt{text-decoration:none;color:inherit}
.mk-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:8px;display:block}
.sold{opacity:.6}
select{width:100%;background:#F7F5FD;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;font:inherit;color:inherit}
.pf{display:flex;gap:2px;border-top:1px solid var(--line);padding-top:8px;position:relative;flex-wrap:wrap}
.act{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;padding:7px 9px!important;font-size:13px!important}
.em{font-size:18px;line-height:1}
.rpick{position:absolute;bottom:100%;left:0;margin-bottom:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 8px;display:flex;gap:2px;box-shadow:0 4px 16px rgba(36,26,63,.18);z-index:5}
.rpick button{font-size:27px;line-height:1;padding:3px 4px;border-radius:99px;transition:transform .12s}
.rpick button:active{transform:scale(1.35)}
.rsum{font-size:13px;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:4px}
.pimg{width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin:2px 0 10px;display:block}
.shared{border:1px solid var(--line);border-radius:14px;padding:10px;margin:4px 0 10px}
.rcpt{align-self:flex-end;font-size:11px;color:var(--muted);margin:-2px 4px 0}
.prev{position:relative;margin:6px 0}
.prev img{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block}
.prev .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:28px;height:28px}
.act{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;color:var(--muted);font-weight:600;font-size:14px}
.act:hover{background:#F3F0FB}
.act.on{color:var(--coral)}
.cms{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.cm{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.bub{background:#F3F0FB;border-radius:14px;padding:7px 12px;font-size:14.5px;overflow-wrap:anywhere;flex:1}
.crow{display:flex;gap:8px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:26px 16px}
.empty .btn{margin-top:12px}

/* people */
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .nm{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.person .nm strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .nm span{font-size:13px;color:var(--muted)}
.person .btns{display:flex;gap:6px}
.search{margin-bottom:10px}

/* chat thread */
.thread{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.th{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:16px;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--coral);color:#fff;border-bottom-right-radius:5px}
.m.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.m time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.mrow{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}

/* profile + admin */
.prof{text-align:center}
.prof .av{margin:6px 0 10px}
.prof h2{margin:0}
.stack>*+*{margin-top:10px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:#F3F0FB;border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

/* notificações, stories, grupos */
.bell{position:relative}
.bell .dot{top:-2px;left:auto;right:-4px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:4px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:64px;font-size:12px;color:var(--muted)}
.strip .nm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--coral),#7A5CFA);display:inline-flex}
.ring.seen{background:var(--line)}
.ring>*{border:3px solid var(--bg);border-radius:50%}
.addst{width:58px;height:58px;border-radius:50%;border:2px dashed var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.notif{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.notif:last-child{border-bottom:0}
.notif.new{background:#FFF2F4;margin:0 -14px;padding:10px 14px;width:calc(100% + 28px)}
.notif .nt{flex:1;min-width:0;line-height:1.3}
.notif .nt span{display:block;font-size:13px;color:var(--muted)}
#viewer{position:fixed;inset:0;background:#111;z-index:70;display:none;flex-direction:column;max-width:560px;margin:0 auto}
#viewer.show{display:flex}
.vbars{display:flex;gap:4px;padding:10px 12px 6px}
.vbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.vbars i b{display:block;height:100%;width:0;background:#fff}
.vbars i.done b{width:100%}
.vbars i.cur.go b{width:100%;transition:width 5s linear}
.vtop{display:flex;align-items:center;gap:10px;padding:4px 12px;color:#fff}
.vtop .who span{color:rgba(255,255,255,.7)}
.vtop .x{color:#fff}
.vbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vbody img{max-width:100%;max-height:100%;object-fit:contain}
.vbody .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 20px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;text-align:center;font-size:18px;overflow-wrap:anywhere}
.vbody .big{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:28px;font-size:28px;font-weight:800;text-align:center;color:#fff;overflow-wrap:anywhere;line-height:1.25}
.vtap{position:absolute;top:0;bottom:0;width:40%}
.vtap.l{left:0}.vtap.r{right:0}
.swatches{display:flex;gap:8px;margin:10px 0}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.pick{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pick input{width:20px;height:20px;accent-color:var(--coral);flex:none}
.scroll{max-height:36vh;overflow-y:auto;margin-bottom:12px}
.gav{display:inline-flex;align-items:center;justify-content:center;border-radius:30%;color:#fff;font-weight:800;flex:none}
.m .snd{display:block;font-size:12px;font-weight:700;color:var(--teal);margin-bottom:1px}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(36,26,63,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
.sheet{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.sheet p{margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ---------- Armazenamento ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCIA0LhDLiEhozQIWel2F0LZ9bcNG2HS14",
  authDomain: "chat-face-a2d33.firebaseapp.com",
  databaseURL: "https://chat-face-a2d33-default-rtdb.firebaseio.com",
  projectId: "chat-face-a2d33",
  storageBucket: "chat-face-a2d33.firebasestorage.app",
  messagingSenderId: "32001918754",
  appId: "1:32001918754:web:900d84a9019b98f282c77b"
};
let store = null;
let localMode = false;
async function sget(k,shared=true){ try{ const r=await store.get(k,shared); return r?r.value:null; }catch(e){ return null; } }
async function sset(k,v,shared=true){ try{ await store.set(k,typeof v==='string'?v:JSON.stringify(v),shared); return true; }catch(e){ console.error(e); return false; } }
async function sdel(k,shared=true){ try{ await store.delete(k,shared); }catch(e){} }
async function slistv(p,shared=true){ try{ if(store.listv) return await store.listv(p,shared); const ks=await slist(p,shared); return await Promise.all(ks.map(async k=>({key:k,value:await sget(k,shared)}))); }catch(e){ return []; } }
async function slist(p,shared=true){ try{ const r=await store.list(p,shared); return (r&&r.keys)||[]; }catch(e){ return []; } }
async function jget(k,shared=true){ const v=await sget(k,shared); if(v==null) return null; try{ return JSON.parse(v); }catch(e){ return null; } }

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const el = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => esc(t).replace(/\n/g,'<br>');
const uid = () => String(Date.now()).padStart(13,'0') + Math.random().toString(36).slice(2,6);
const val = s => { const e=$(s); return e?e.value:''; };
async function hash(txt){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){ let h=0; for(const c of txt) h=(h*31+c.charCodeAt(0))|0; return 'f'+h; }
}
function ago(t){
  const s=Math.floor((Date.now()-t)/1000);
  if(s<45) return 'agora';
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  if(s<604800) return Math.floor(s/86400)+' d';
  return new Date(t).toLocaleDateString('pt-BR');
}
const hhmm = t => new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800);
}
function askConfirm(text,okLabel='Confirmar',danger=false){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row end"><button class="btn ghost" id="mc-no">Cancelar</button><button class="btn ${danger?'danger':''}" id="mc-yes">${esc(okLabel)}</button></div></div>`;
    m.classList.add('show');
    const done=v=>{ m.classList.remove('show'); m.innerHTML=''; res(v); };
    $('#mc-no').onclick=()=>done(false);
    $('#mc-yes').onclick=()=>done(true);
  });
}

function askPassword(text){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><p>${esc(text)}</p><input id="mp" type="password" autocomplete="current-password" placeholder="Sua senha" style="margin-bottom:14px"><div class="row end"><button class="btn ghost" id="mc-no">Cancelar</button><button class="btn danger" id="mc-yes">Excluir</button></div></div>`;
    m.classList.add('show'); setTimeout(()=>{ const i=$('#mp'); if(i) i.focus(); },50);
    const done=v=>{ m.classList.remove('show'); m.innerHTML=''; res(v); };
    $('#mc-no').onclick=()=>done(null);
    $('#mc-yes').onclick=()=>done($('#mp').value);
  });
}
const ICONS={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.6.2 4.1 1.8 4.5 4.5"/>',
  chat:'<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.3 4-6.5 8-6.5s7.2 2.2 8 6.5"/>',
  heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  comment:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8c-3 0-4.5-4-2-4s2 4 2 4zm0 0c3 0 4.5-4 2-4s-2 4-2 4z"/>',

const setErr=m=>{ const e=$('#auth-err'); if(e) e.textContent=m; };

async function doSignup(){
  const name=val('#f-name').trim(), u=val('#f-user').trim().toLowerCase(), p=val('#f-pass');
  if(name.length<2) return setErr('Digite seu nome (mínimo 2 letras).');
  if(!/^[a-z0-9_]{3,20}$/.test(u)) return setErr('Usuário: 3 a 20 caracteres, só letras, números e _.');
  if(p.length<4) return setErr('A senha precisa ter pelo menos 4 caracteres.');
  if(await sget('ban:'+u)) return setErr('Este usuário foi bloqueado pelo dono. Escolha outro.');
  if(await sget('user:'+u)) return setErr('Este usuário já existe. Escolha outro.');
  const rec={username:u,name,bio:'',pass:await hash(u+':'+p),created:Date.now()};
  if(!(await sset('user:'+u,rec))) return setErr('Não foi possível criar a conta. Tente de novo.');
  state.users[u]=rec;
  await startSession(rec);
}
async function doLogin(){
  const u=val('#f-user').trim().toLowerCase(), p=val('#f-pass');
  if(!u||!p) return setErr('Preencha usuário e senha.');
  const rec=await jget('user:'+u);
  if(!rec) return setErr((await sget('ban:'+u))?'Esta conta foi removida pelo dono.':'Usuário não encontrado.');
  if(rec.pass!==await hash(u+':'+p)) return setErr('Senha incorreta.');
  await startSession(rec);
}
async function startSession(rec){
  state.me=rec; state.users[rec.username]=rec; state.tab='feed'; state.chat=null; state.adminOk=false;
  await sset('session',{u:rec.username,p:rec.pass},false);
  shell(); startPolling();
}
async function forceLogout(msg){
  clearInterval(timer);
  await sdel('session',false);
  Object.assign(state,{me:null,adminOk:false,chat:null,tab:'feed',posts:[],postCache:{},open:new Set(),msgs:[],msgCache:{},saved:new Set(),savedPosts:[],bdays:{},events:[],goingCount:{},myGoing:new Set(),items:[],pages:[],pfollowCount:{},myFollows:new Set(),pageUpd:{},reactBy:{},myReact:{},picker:null,otherSeen:0,seenSent:{}});

}

function nextBday(v){
  const [mo,d]=v.split('-').map(Number), now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let n=new Date(now.getFullYear(),mo-1,d); if(n<t0) n=new Date(now.getFullYear()+1,mo-1,d);
  return Math.round((n-t0)/86400000);
}

async function loadPages(){
  const me=state.me.username;
  const [pk,fk,uk]=await Promise.all([slist('page:'),slist('pfollow:'),slist('pupd:')]);
  const fc={}, mine=new Set();
  fk.forEach(k=>{ const [,pid,u]=k.split(':'); fc[pid]=(fc[pid]||0)+1; if(u===me) mine.add(pid); });
  const pages=(await Promise.all(pk.map(async k=>{ const v=await jget(k); return v?{...v,id:k.slice(5)}:null; }))).filter(Boolean).sort((a,b)=>b.id.localeCompare(a.id));
  const by={}; uk.forEach(k=>{ const pid=k.split(':')[1]; (by[pid]=by[pid]||[]).push(k); });
  const upd={};
  await Promise.all(pages.map(async pg=>{
    const ks=(by[pg.id]||[]).sort().reverse().slice(0,3);
    upd[pg.id]=(await Promise.all(ks.map(async k=>{ const v=await jget(k); return v?{...v,key:k}:null; }))).filter(Boolean);
  }));
  await ensureUsers([...new Set(pages.map(x=>x.owner))]);
  Object.assign(state,{pages,pfollowCount:fc,myFollows:mine,pageUpd:upd});
  renderPages();
}
function renderPages(){
  const box=$('#pg-list'); if(!box) return;
  const me=state.me.username;

}

async function removeUser(u,ban=true){
  if(ban) await sset('ban:'+u,'1');
  await sdel('user:'+u);
  const [posts,likes,comments,reqs,friends,msgs,reports,stories,notifs,gmems,gmsgs,groups]=await Promise.all(['post:','like:','comment:','req:','friend:','msg:','report:','story:','notif:','gmem:','gmsg:','group:'].map(p=>slist(p)));
  const dels=[];
  const dead=new Set();
  for(const k of posts){ const v=await jget(k); if(v&&v.author===u){ dels.push(k); dead.add(k.slice(5)); } }
  likes.forEach(k=>{ const [,pid,who]=k.split(':'); if(who===u||dead.has(pid)) dels.push(k); });
  comments.forEach(k=>{ const p=k.split(':'); if(p[3]===u||dead.has(p[1])) dels.push(k); });
  reqs.forEach(k=>{ const p=k.split(':'); if(p[1]===u||p[2]===u) dels.push(k); });
  friends.forEach(k=>{ const p=k.split(':'); if(p[1]===u||p[2]===u) dels.push(k); });
  msgs.forEach(k=>{ const p=k.split(':'); if(p[1]===u||p[2]===u) dels.push(k); });
  reports.forEach(k=>{ const p=k.split(':'); if(p[2]===u||dead.has(p[1])) dels.push(k); });
  stories.forEach(k=>{ if(k.split(':')[2]===u) dels.push(k); });
  notifs.forEach(k=>{ const p=k.split(':'); if(p[1]===u||p[4]===u) dels.push(k); });
  gmems.forEach(k=>{ if(k.split(':')[2]===u) dels.push(k); });
  gmsgs.forEach(k=>{ if(k.split(':')[3]===u) dels.push(k); });
  for(const k of groups){ const v=await jget(k); if(v&&v.owner===u){ const gid=k.slice(6); dels.push(k); gmems.forEach(x=>{ if(x.split(':')[1]===gid) dels.push(x); }); gmsgs.forEach(x=>{ if(x.split(':')[1]===gid) dels.push(x); }); } }
  const [svk,bdk,evk,gok,itk]=await Promise.all(['save:','bday:','event:','going:','item:'].map(x=>slist(x)));
  svk.forEach(k=>{ if(k.split(':')[1]===u) dels.push(k); });
  bdk.forEach(k=>{ if(k.slice(5)===u) dels.push(k); });
  const deadEv=new Set();
  for(const k of evk){ const v=await jget(k); if(v&&v.author===u){ dels.push(k); deadEv.add(k.slice(6)); } }
  gok.forEach(k=>{ const q=k.split(':'); if(q[2]===u||deadEv.has(q[1])) dels.push(k); });
  for(const k of itk){ const v=await jget(k); if(v&&v.author===u) dels.push(k); }
  const [pgk,pfk,puk]=await Promise.all(['page:','pfollow:','pupd:'].map(x=>slist(x)));
  const deadPg=new Set();
  for(const k of pgk){ const v=await jget(k); if(v&&v.owner===u){ dels.push(k); deadPg.add(k.slice(5)); } }
  pfk.forEach(k=>{ const q=k.split(':'); if(q[2]===u||deadPg.has(q[1])) dels.push(k); });
  puk.forEach(k=>{ if(deadPg.has(k.split(':')[1])) dels.push(k); });
  const [prk,tyk,sek]=await Promise.all(['presence:','typing:','seen:'].map(x=>slist(x)));
  prk.forEach(k=>{ if(k.slice(9)===u) dels.push(k); });
  [...tyk,...sek].forEach(k=>{ const q=k.split(':'); if(q[1]===u||q[2]===u||q[3]===u) dels.push(k); });
  for(let i=0;i<dels.length;i+=20) await Promise.all(dels.slice(i,i+20).map(k=>sdel(k)));
  delete state.users[u]; state.postCache={};
}

/* ---------- Notificações ---------- */
async function notify(to,type,ref=''){
  if(!to||!state.me||to===state.me.username) return;
  await sset(`notif:${to}:${uid()}:${type}:${state.me.username}${ref?':'+ref:''}`,'1');
}
function parseNotif(k){ const p=k.split(':'); return {key:k,t:+(p[2]||'').slice(0,13),type:p[3],from:p[4],ref:p[5]||''}; }
async function loadNotifs(){
  if(!state.me) return;
  const [keys,seen]=await Promise.all([slist(`notif:${state.me.username}:`),sget('nseen:'+state.me.username)]);
  state.nseen=+seen||0;
  const all=keys.map(parseNotif).sort((a,b)=>b.t-a.t);
  all.slice(40).forEach(n=>sdel(n.key));
  state.notifs=all.slice(0,40);
  updateBell();
}
function updateBell(){
  const n=state.notifs.filter(x=>x.t>state.nseen).length, d=$('#dot-bell');
  if(d){ d.hidden=!n; d.textContent=n>9?'9+':n; }
}
function clearMsgNotifs(from){
  const ks=state.notifs.filter(n=>n.type==='msg'&&n.from===from).map(n=>n.key);
  if(!ks.length) return;
  ks.forEach(k=>sdel(k)); state.notifs=state.notifs.filter(n=>!ks.includes(n.key)); updateBell();
}
async function renderNotifs(){
  const m=$('#main'); if(!m) return;
  await loadNotifs();
  await ensureUsers([...new Set(state.notifs.map(n=>n.from))]);
  const prev=state.nseen;
  const TXT={like:'curtiu sua publicação',comment:'comentou na sua publicação',req:'enviou um pedido de amizade',friend:'aceitou seu pedido de amizade',msg:'enviou uma mensagem',ginvite:'adicionou você a um grupo'};
  if(state.tab!=='notifs') return;
  m.innerHTML=`<div class="row" style="margin-bottom:8px"><button class="x" data-act="tab" data-t="feed">${icon('back')} Voltar</button></div><h3>Notificações</h3><div class="card">${state.notifs.length?state.notifs.map(n=>`<button class="notif ${n.t>prev?'new':''}" data-act="notif-go" data-type="${esc(n.type)}" data-from="${esc(n.from)}" data-ref="${esc(n.ref)}">${avatar(n.from,40)}<div class="nt"><strong>${esc(nameOf(n.from))}</strong> ${TXT[n.type]||'fez algo'}<span>${ago(n.t)}</span></div></button>`).join(''):'<p class="muted">Nada por aqui ainda.</p>'}</div>`;
  state.nseen=Date.now(); updateBell(); await sset('nseen:'+state.me.username,String(state.nseen));
}

/* ---------- Stories ---------- */
const DAY=86400000;
const okStoryImg=p=>typeof p==='string'&&p.length<220000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p);
const okColor=c=>typeof c==='string'&&/^#[0-9A-Fa-f]{6}$/.test(c);
function resizeImage(file,max,q=0.6){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>rej(new Error('img'));
    img.src=url;
  });
}
async function loadStories(){
  if(!state.me) return;
  if(!state.socialLoaded) await loadSocial();
  const keys=await slist('story:');
  const now=Date.now(), list=[];
  keys.forEach(k=>{
    const [,id,au]=k.split(':'), t=+(id||'').slice(0,13);
    if(now-t>DAY) sdel(k); else list.push({key:k,author:au,t});
  });
  const vis=new Set([...state.social.friends,state.me.username]);
  state.stories=list.filter(x=>vis.has(x.author)).sort((a,b)=>a.t-b.t);
  await ensureUsers([...new Set(state.stories.map(x=>x.author))]);
  renderStories();
}
function renderStories(){
  const box=$('#stories'); if(!box) return;
  const me=state.me.username, by={};
  state.stories.forEach(x=>(by[x.author]=by[x.author]||[]).push(x));
  const ring=(u,label)=>{ const seen=by[u].every(x=>state.storySeen.has(x.key)); return `<button data-act="view-story" data-u="${esc(u)}"><span class="ring ${seen?'seen':''}">${avatar(u,52)}</span><span class="nm">${esc(label)}</span></button>`; };
  box.innerHTML=`<button data-act="new-story" aria-label="Criar story"><span class="addst">+</span><span class="nm">Seu story</span></button>`
    +(by[me]?ring(me,'Você'):'')
    +Object.keys(by).filter(a=>a!==me).map(a=>ring(a,nameOf(a).split(' ')[0])).join('');
}
function openStoryComposer(){

const V={list:[],i:0,t:null};
async function viewStories(u){
  const list=state.stories.filter(x=>x.author===u); if(!list.length) return;
  const full=await Promise.all(list.map(async x=>({...x,...((await jget(x.key))||{})})));
  V.list=full.filter(x=>x.text||x.img); if(!V.list.length) return;
  const i=V.list.findIndex(x=>!state.storySeen.has(x.key)); V.i=i<0?0:i;
  $('#viewer').classList.add('show'); showStory();
}
function showStory(){
  const v=$('#viewer'), s=V.list[V.i]; if(!s) return closeViewer();
  state.storySeen.add(s.key); clearTimeout(V.t);
  const mine=s.author===state.me.username;
  const bars=V.list.map((_,j)=>`<i class="${j<V.i?'done':j===V.i?'cur':''}"><b></b></i>`).join('');
  const body=okStoryImg(s.img)
    ?`<img alt="" src="${s.img}">${s.text?`<div class="cap">${fmt(s.text)}</div>`:''}`
    :`<div class="big" style="background:${okColor(s.bg)?s.bg:COLORS[0]}">${fmt(s.text||'')}</div>`;
  v.innerHTML=`<div class="vbars">${bars}</div>
    <div class="vtop">${avatar(s.author,36)}<div class="who grow"><strong>${esc(nameOf(s.author))}</strong><span>${ago(s.t)}</span></div>${mine?`<button class="x" id="v-del" aria-label="Apagar story">${icon('trash')}</button>`:''}<button class="x" id="v-x" aria-label="Fechar">${icon('close')}</button></div>
    <div class="vbody">${body}<div class="vtap l" id="v-l"></div><div class="vtap r" id="v-r"></div></div>`;
  $('#v-x').onclick=closeViewer;
  $('#v-l').onclick=()=>{ V.i=Math.max(0,V.i-1); showStory(); };
  $('#v-r').onclick=nextStory;
  const del=$('#v-del');
  if(del) del.onclick=async()=>{
    clearTimeout(V.t); await sdel(s.key);
    state.stories=state.stories.filter(x=>x.key!==s.key); V.list.splice(V.i,1); toast('Story apagado.');
    if(!V.list.length) closeViewer(); else { V.i=Math.min(V.i,V.list.length-1); showStory(); }
  };
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const c=v.querySelector('.vbars i.cur'); if(c) c.classList.add('go'); }));
  V.t=setTimeout(nextStory,5000);
}
function nextStory(){ V.i++; if(V.i>=V.list.length) closeViewer(); else showStory(); }
function closeViewer(){ clearTimeout(V.t); const v=$('#viewer'); v.classList.remove('show'); v.innerHTML=''; renderStories(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeViewer(); });

const gav=(g,size=44)=>`<span class="gav" style="width:${size}px;height:${size}px;background:${colorOf(g.id)};font-size:${Math.round(size*.42)}px">${esc((g.name||'?').trim().charAt(0).toUpperCase())}</span>`;
function chatsSkeleton(){

async function loadGroups(){
  const keys=await slist('gmem:'), by={};
  keys.forEach(k=>{ const [,gid,u]=k.split(':'); (by[gid]=by[gid]||new Set()).add(u); });
  const mine=Object.keys(by).filter(g=>by[g].has(state.me.username));
  const recs=await Promise.all(mine.map(async g=>{ const r=await jget('group:'+g); return r?{id:g,...r}:null; }));
  state.groups=recs.filter(Boolean).sort((a,b)=>b.t-a.t);
  state.gmembers={}; state.groups.forEach(g=>state.gmembers[g.id]=by[g.id]);
  await ensureUsers([...new Set(state.groups.flatMap(g=>[...by[g.id]]))]);
}

async function loadGMsgs(first){

function renderGMsgs(force){

  m.classList.add('show');
  const close=()=>{ m.classList.remove('show'); m.innerHTML=''; };
  $('#gi-close').onclick=close;
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{ await sdel(`gmem:${gid}:${b.dataset.rm}`); await loadGroups(); openGroupInfo(); });
  const add=$('#gi-add');
  if(add) add.onclick=async()=>{
    const picked=[...m.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value); if(!picked.length) return toast('Marque pelo menos um amigo.');
    await Promise.all(picked.map(u=>sset(`gmem:${gid}:${u}`,'1')));
    picked.forEach(u=>notify(u,'ginvite',gid));
    close(); await loadGroups(); renderTab(); toast('Amigos adicionados.');
  };
  const lv=$('#gi-leave');
  if(lv) lv.onclick=async()=>{
    close(); if(!(await askConfirm('Sair deste grupo?','Sair',true))) return;
    await sdel(`gmem:${gid}:${me}`); state.gchat=null; await loadGroups(); renderTab();
  };
  const dl=$('#gi-del');
  if(dl) dl.onclick=async()=>{
    close(); if(!(await askConfirm('Excluir o grupo e todas as mensagens? Isso não pode ser desfeito.','Excluir grupo',true))) return;
    await deleteGroup(gid); state.gchat=null; state.groups=state.groups.filter(x=>x.id!==gid); renderTab(); toast('Grupo excluído.');
  };
}
async function loadAdminGroups(){
  const box=$('#admin-groups'); if(!box) return;
  const [gk,mk]=await Promise.all([slist('group:'),slist('gmem:')]);
  const cnt={}; mk.forEach(k=>{ const g=k.split(':')[1]; cnt[g]=(cnt[g]||0)+1; });
  const gs=(await Promise.all(gk.map(async k=>{ const r=await jget(k); return r?{id:k.slice(6),...r}:null; }))).filter(Boolean);
  box.innerHTML=gs.length?gs.map(g=>`<div class="person">${gav(g,40)}<div class="nm"><strong>${esc(g.name)}</strong><span>${cnt[g.id]||0} pessoas, dono @${esc(g.owner)}</span></div><div class="btns"><button class="btn small danger" data-act="admin-del-group" data-id="${g.id}">Excluir</button></div></div>`).join(''):'<p class="muted">Nenhum grupo criado.</p>';
}

/* ---------- Atualização automática ---------- */
let timer=null;
function startPolling(){ clearInterval(timer); timer=setInterval(tick,4000); tick(); }
let busy=false;
async function tick(){
  if(!state.me||document.hidden||busy) return;
  busy=true;
  try{
    const ok=await jget('user:'+state.me.username);
    if(!ok){ const banned=await sget('ban:'+state.me.username); busy=false; await forceLogout(banned?'Sua conta foi removida pelo dono.':'Conta não encontrada.'); return; }
    if(Date.now()-lastBeat>25000){ lastBeat=Date.now(); sset('presence:'+state.me.username,String(Date.now())); }
    await loadNotifs();
    const a=document.activeElement;
    if(['feed','videos','reels','saved'].includes(state.tab)){ if(!(a&&a.closest&&a.closest('#feed-list'))){ await loadFeed(true); if(state.tab==='feed') await loadStories(); } }
    else if(state.tab==='people'||(state.tab==='chats'&&!state.chat&&!state.gchat)) await loadSocial();
    else if(state.tab==='chats'&&(state.chat||state.gchat)){
      if(state.gchat){ await loadGroups(); if(!state.groups.find(g=>g.id===state.gchat)){ state.gchat=null; toast('Você não está mais neste grupo.'); renderTab(); busy=false; return; } }
      await loadMsgs();
    }
    else if(state.tab==='admin'&&state.adminOk){ await loadAdminUsers(); await loadReports(); await loadAdminGroups(); }
    if(state.tab==='feed'||state.tab==='me'){ const [rk]=await Promise.all([slist('req:')]); const n=rk.filter(k=>k.split(':')[2]===state.me.username).length; const d=$('#dot-people'); if(d){ d.hidden=!n; d.textContent=n; } }
  }catch(e){ console.error(e); }
  busy=false;
}

/* ---------- Início ---------- */
async function initStore(){
  let ls=null;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls=localStorage; }catch(e){}
  const P='chatface:', mem=new Map();
  const loc=ls?{
    async get(k){ const v=ls.getItem(P+k); if(v===null) throw new Error('nf'); return {key:k,value:v}; },
    async set(k,v){ ls.setItem(P+k,v); return {key:k,value:v}; },
    async delete(k){ ls.removeItem(P+k); return {key:k,deleted:true}; },
    async list(p=''){ const out=[]; for(let i=0;i<ls.length;i++){ const k=ls.key(i); if(k.startsWith(P+p)) out.push(k.slice(P.length)); } return {keys:out}; },
    async listv(p=''){ const out=[]; for(let i=0;i<ls.length;i++){ const k=ls.key(i); if(k.startsWith(P+p)) out.push({key:k.slice(P.length),value:ls.getItem(k)}); } return out; }
  }:{
    async get(k){ if(!mem.has(k)) throw new Error('nf'); return {key:k,value:mem.get(k)}; },
    async set(k,v){ mem.set(k,v); return {key:k,value:v}; },
    async delete(k){ mem.delete(k); return {key:k,deleted:true}; },
    async list(p=''){ return {keys:[...mem.keys()].filter(k=>k.startsWith(p))}; },
    async listv(p=''){ return [...mem.entries()].filter(([k])=>k.startsWith(p)).map(([key,value])=>({key,value})); }
  };
  try{
    const B='https://www.gstatic.com/firebasejs/13.0.0/';
    const [appMod,dbMod]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-database.js')]);
    const {getDatabase,ref,get,set,remove,query,orderByKey,startAt,endAt}=dbMod;
    const d=getDatabase(appMod.initializeApp(firebaseConfig));
    let _kc=null,_kt=0;
    const allKeys=async()=>{
      if(_kc&&Date.now()-_kt<1200) return _kc;
      const r=await fetch(firebaseConfig.databaseURL+'/kv.json?shallow=true'); if(!r.ok) throw new Error('shallow '+r.status);
      _kc=Object.keys((await r.json())||{}).sort(); _kt=Date.now(); return _kc;
    };
    const fb={
      async get(k){ const s=await get(ref(d,'kv/'+k)); if(!s.exists()) throw new Error('nf'); return {key:k,value:s.val()}; },
      async set(k,v){ await set(ref(d,'kv/'+k),v); _kt=0; return {key:k,value:v}; },
      async delete(k){ await remove(ref(d,'kv/'+k)); _kt=0; return {key:k,deleted:true}; },
      async list(p=''){
        try{ return {keys:(await allKeys()).filter(k=>k.startsWith(p))}; }catch(e){}
        const s=await get(query(ref(d,'kv'),orderByKey(),startAt(p),endAt(p+'\uf8ff'))); const out=[]; s.forEach(c=>{ out.push(c.key); }); return {keys:out};
      },
      async listv(p=''){ const s=await get(query(ref(d,'kv'),orderByKey(),startAt(p),endAt(p+'\uf8ff'))); const out=[]; s.forEach(c=>{ out.push({key:c.key,value:c.val()}); }); return out; }
    };
    /* dados compartilhados vão para o Firebase; a sessão (shared=false) fica só neste aparelho */
    store={
      get:(k,sh=true)=>sh?fb.get(k):loc.get(k),
      set:(k,v,sh=true)=>sh?fb.set(k,v):loc.set(k,v),
      delete:(k,sh=true)=>sh?fb.delete(k):loc.delete(k),
      list:(p,sh=true)=>sh?fb.list(p):loc.list(p),
      listv:(p,sh=true)=>sh?fb.listv(p):loc.listv(p)
    };
    await store.set('__t','1',true); await store.get('__t',true); await store.delete('__t',true);
    localMode=false; return;
  }catch(e){ console.error('Firebase indisponível:',e); }
  localMode=true; store=loc;
}
(async function boot(){
  el.innerHTML='<div class="boot">'+logo(60)+'</div>';
  await initStore();
  const s=await jget('session',false);
  if(s&&s.u){
    const rec=await jget('user:'+s.u);
    if(rec&&rec.pass===s.p){ await startSession(rec); return; }
  }
  viewAuth('login');
})();
</script>
